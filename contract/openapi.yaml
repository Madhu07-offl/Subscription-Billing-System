openapi: 3.0.3
info:
  title: Brightloop Subscription Billing API
  version: 1.0.0
  description: |
    Contract between the frontend and the backend. Frozen at v1 after Gate 1; changes go through a reviewed PR.

    **Roles**: `admin` (whole system), `staff` (day-to-day work, limited), `customer` (portal, own data only).
    Each operation lists who may call it. Customers calling a shared endpoint (for example `GET /subscriptions`)
    are automatically scoped to their own records by the server.

    **Conventions**
    - Base path `/api/v1`, JSON bodies, `Authorization: Bearer <jwt>` on everything except public auth endpoints.
    - Ids are UUID strings. Dates are `YYYY-MM-DD`. Timestamps are ISO 8601 UTC.
    - Money is a decimal string with exactly two decimals (for example `"560.00"`), never a JSON float, in the single system currency.
    - Lists are paginated: `?page=1&limit=20` (limit max 100) and return `{ data: [...], meta: {...} }`.
    - Every error uses the `Error` shape. Standard statuses: 400 `VALIDATION_ERROR`, 401 `UNAUTHENTICATED`,
      403 `FORBIDDEN`, 404 `NOT_FOUND`, 409 `CONFLICT` (duplicate or wrong state), 422 `BUSINESS_RULE`.
    - Extra detail for every endpoint lives in `contract/API.md`.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development (Prism mock uses the same path)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Signup, login, password reset, own profile
  - name: Users
    description: Staff and user management (admin)
  - name: Customers
    description: Customer records
  - name: Products
    description: Products and their variants
  - name: Plans
    description: Recurring plans
  - name: Quotation Templates
    description: Reusable quotation starting points
  - name: Subscriptions
    description: Subscriptions and their lifecycle
  - name: Billing
    description: Bulk invoice generation
  - name: Invoices
    description: Invoices and their lifecycle
  - name: Taxes
    description: Tax rules
  - name: Discounts
    description: Discount rules
  - name: Payments
    description: Payments recorded against invoices
  - name: Reports
    description: Finance dashboard data

paths:
  # ------------------------------------------------------------------ AUTH
  /auth/signup:
    post:
      tags: [Auth]
      summary: Customer signs up
      description: |
        Public. Creates a customer user plus its customer record. Email must be unique (409 if taken).
        Password must be longer than 8 characters with an uppercase letter, a lowercase letter and a special character.
        If staff already created a customer with this email (no login), the new user is linked to that record and keeps its subscriptions instead of creating a duplicate.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Account created and logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Public. Returns a JWT. Wrong email or password returns 401. Deactivated users get 403.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: |
        Public. Always returns 202 whether or not the email exists, so accounts cannot be probed.
        If the email is registered, a reset link with a single-use token (valid 30 minutes) is emailed.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using the emailed token
      description: Public. Token must be valid, unused and unexpired (400 otherwise). New password follows the password rules.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password
      description: Any logged-in user. Requires the current password.
      operationId: changePassword
      x-roles: [admin, staff, customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: Any logged-in user. Used by the frontend to restore a session and decide which screens to show.
      operationId: getMe
      x-roles: [admin, staff, customer]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Auth]
      summary: Update own profile
      description: Any logged-in user. Customers can also update their customer details (phone, company, address).
      operationId: updateMe
      x-roles: [admin, staff, customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ----------------------------------------------------------------- USERS
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Admin only. Filter by role and search by name or email.
      operationId: listUsers
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /users/staff:
    post:
      tags: [Users]
      summary: Add a staff member
      description: Admin only. The only way to create a staff user. Email must be unique (409). Initial password follows the password rules.
      operationId: createStaff
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreate' }
      responses:
        '201':
          description: Staff user created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Users]
      summary: Get a user
      description: Admin only.
      operationId: getUser
      x-roles: [admin]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Users]
      summary: Update or deactivate a user
      description: Admin only. Set `isActive=false` to block login without deleting history. An admin cannot deactivate themselves (422).
      operationId: updateUser
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------- CUSTOMERS
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      description: Admin, staff. Search by name, email or company.
      operationId: listCustomers
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Page of customers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Customers]
      summary: Create a customer
      description: Admin, staff. For customers who did not sign up themselves, for example a company a sales rep is quoting. No login is created.
      operationId: createCustomer
      x-roles: [admin, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Created customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Customers]
      summary: Get a customer
      description: Admin, staff.
      operationId: getCustomer
      x-roles: [admin, staff]
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Customers]
      summary: Update a customer
      description: Admin, staff.
      operationId: updateCustomer
      x-roles: [admin, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- PRODUCTS
  /products:
    get:
      tags: [Products]
      summary: List products
      description: All logged-in roles can read. Customers see only active products.
      operationId: listProducts
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ProductType' }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Products]
      summary: Create a product
      description: Admin only. Variants can be sent inline or added later.
      operationId: createProduct
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Products]
      summary: Get a product with its variants
      description: All logged-in roles.
      operationId: getProduct
      x-roles: [admin, staff, customer]
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Products]
      summary: Update a product
      description: Admin only. Changing a price does not change existing subscription lines or invoices.
      operationId: updateProduct
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Products]
      summary: Archive a product
      description: Admin only. Soft delete (`isActive=false`) so old subscriptions and invoices keep working. 204 on success.
      operationId: archiveProduct
      x-roles: [admin]
      responses:
        '204': { description: Archived }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}/variants:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Products]
      summary: Add a variant to a product
      description: Admin only. A variant is an attribute value with a price adjustment, for example Brand = Odoo adds 560.00.
      operationId: createVariant
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '201':
          description: Created variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}/variants/{variantId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: variantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Products]
      summary: Update a variant
      description: Admin only.
      operationId: updateVariant
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantUpdate' }
      responses:
        '200':
          description: Updated variant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Variant' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Products]
      summary: Remove a variant
      description: Admin only. Variants already used on a subscription line are archived instead of removed. 204 on success.
      operationId: deleteVariant
      x-roles: [admin]
      responses:
        '204': { description: Removed }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ----------------------------------------------------------------- PLANS
  /plans:
    get:
      tags: [Plans]
      summary: List plans
      description: All logged-in roles. Customers see only plans that are active and inside their availability dates.
      operationId: listPlans
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - name: billingPeriod
          in: query
          schema: { $ref: '#/components/schemas/BillingPeriod' }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of plans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Plans]
      summary: Create a plan
      description: Admin only. The four flags decide what can happen to subscriptions on this plan.
      operationId: createPlan
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201':
          description: Created plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /plans/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Plans]
      summary: Get a plan
      description: All logged-in roles.
      operationId: getPlan
      x-roles: [admin, staff, customer]
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Plans]
      summary: Update a plan
      description: Admin only. Changes apply to future billing only; issued invoices are untouched.
      operationId: updatePlan
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanUpdate' }
      responses:
        '200':
          description: Updated plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Plans]
      summary: Deactivate a plan
      description: Admin only. Soft delete (`isActive=false`). Existing subscriptions keep running. 204 on success.
      operationId: deactivatePlan
      x-roles: [admin]
      responses:
        '204': { description: Deactivated }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------ QUOTATION TEMPLATES
  /quotation-templates:
    get:
      tags: [Quotation Templates]
      summary: List quotation templates
      description: Admin, staff.
      operationId: listQuotationTemplates
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Page of templates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotationTemplateList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Quotation Templates]
      summary: Create a quotation template
      description: Admin only. A template fixes the plan, the product lines and how many days a quotation stays valid.
      operationId: createQuotationTemplate
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotationTemplateInput' }
      responses:
        '201':
          description: Created template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotationTemplate' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /quotation-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Quotation Templates]
      summary: Get a quotation template
      description: Admin, staff.
      operationId: getQuotationTemplate
      x-roles: [admin, staff]
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotationTemplate' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Quotation Templates]
      summary: Update a quotation template
      description: Admin only. Does not change subscriptions already created from it.
      operationId: updateQuotationTemplate
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotationTemplateUpdate' }
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotationTemplate' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Quotation Templates]
      summary: Delete a quotation template
      description: Admin only. 204 on success.
      operationId: deleteQuotationTemplate
      x-roles: [admin]
      responses:
        '204': { description: Deleted }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------- SUBSCRIPTIONS
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: List subscriptions
      description: |
        Admin, staff see all. Customers see only their own. Everyone can see the status, so the team always knows where a subscription stands.
      operationId: listSubscriptions
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: planId
          in: query
          schema: { type: string, format: uuid }
        - name: expiringBefore
          in: query
          description: Only subscriptions whose expiry date is on or before this date
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page of subscriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Subscriptions]
      summary: Create a subscription (Draft)
      description: |
        Admin, staff. Creates a `draft` with an auto-generated number (for example SUB-0001).
        Send `templateId` to start from a quotation template: the plan and lines are copied and any field you also send overrides the template.
        Line `unitPrice` defaults to product price plus variant adjustment; taxes are resolved from tax rules; totals are computed by the server.
        Violating the plan minimum quantity or availability dates returns 422.
      operationId: createSubscription
      x-roles: [admin, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201':
          description: Draft subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Subscriptions]
      summary: Get a subscription with lines and totals
      description: Admin, staff, and the owning customer.
      operationId: getSubscription
      x-roles: [admin, staff, customer]
      responses:
        '200':
          description: The subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Subscriptions]
      summary: Edit a subscription
      description: Admin, staff. Allowed only while status is `draft` or `quotation`; otherwise 409. Sending `lines` replaces all lines.
      operationId: updateSubscription
      x-roles: [admin, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionUpdate' }
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Subscriptions]
      summary: Delete a draft subscription
      description: Admin, staff. Only `draft` can be deleted (409 otherwise). 204 on success.
      operationId: deleteSubscription
      x-roles: [admin, staff]
      responses:
        '204': { description: Deleted }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/send-quotation:
    post:
      tags: [Subscriptions]
      summary: Draft to Quotation
      description: |
        Admin, staff. Moves `draft` to `quotation` and sets `quotationValidUntil` (today plus the template validity days, default 30).
        Requires a customer, plan, `startDate`, `expiryDate`, `paymentTerms` and at least one line (422 listing the missing fields otherwise).
        Also re-checks the plan rules (minimum quantity, availability dates) and that `expiryDate` is after `startDate`.
      operationId: sendQuotation
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Subscription in quotation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/confirm:
    post:
      tags: [Subscriptions]
      summary: Quotation to Confirmed
      description: Admin, staff. Moves `quotation` to `confirmed`. Fails with 422 if the quotation has expired (`quotationValidUntil` is in the past) or the plan rules are no longer met. Locks lines and totals.
      operationId: confirmSubscription
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Confirmed subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/activate:
    post:
      tags: [Subscriptions]
      summary: Confirmed to Active
      description: |
        Admin, staff. Moves `confirmed` to `active` and sets `nextBillingDate` to the start date.
        422 if `startDate`, `expiryDate` or `planId` is missing. Billing runs only pick up `active`, non-paused subscriptions.
      operationId: activateSubscription
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Active subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/close:
    post:
      tags: [Subscriptions]
      summary: Close a subscription (early)
      description: |
        Admin, staff, and the owning customer. Moves `active` to `closed`. Only when the plan has `allowEarlyClose=true`, otherwise 422.
        Closing clears `nextBillingDate`, so nothing more is billed. Invoices already issued are untouched: there is no proration or credit note in v1.
        Subscriptions on plans with `autoClose=true` close by themselves after the expiry date.
      operationId: closeSubscription
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseRequest' }
      responses:
        '200':
          description: Closed subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/pause:
    post:
      tags: [Subscriptions]
      summary: Pause billing
      description: Admin, staff, and the owning customer. Sets `isPaused=true` on an `active` subscription (409 if not active or already paused). Only when the plan has `allowPause=true`, otherwise 422. Paused subscriptions are skipped by billing.
      operationId: pauseSubscription
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Paused subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/resume:
    post:
      tags: [Subscriptions]
      summary: Resume a paused subscription
      description: Admin, staff, and the owning customer. Sets `isPaused=false`. 409 if not paused. Paused time is not billed, because `nextBillingDate` becomes the later of its current value and today, so no catch-up invoices are created for the pause.
      operationId: resumeSubscription
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Resumed subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/renew:
    post:
      tags: [Subscriptions]
      summary: Renew a subscription
      description: |
        Admin, staff, and the owning customer. Extends `expiryDate` by one plan term (or to `newExpiryDate`, which must be after the current expiry).
        Only for an `active` subscription (409 otherwise): a `closed` subscription is never reopened, create a new one instead.
        Only when the plan has `allowRenew=true`, otherwise 422.
      operationId: renewSubscription
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewRequest' }
      responses:
        '200':
          description: Renewed subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/invoices:
    get:
      tags: [Subscriptions]
      summary: Invoices of a subscription
      description: Admin, staff, and the owning customer. Newest first.
      operationId: listSubscriptionInvoices
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of invoices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /subscriptions/request:
    post:
      tags: [Subscriptions]
      summary: Customer requests a subscription
      description: |
        Customer only. Self-service start: the customer picks an active plan, a start date and product lines. The server creates a `draft`
        for the calling customer (never for anyone else), copies the product price plus variant adjustment (no price override), and staff
        take it from there (`send-quotation`, `confirm`, `activate`). 422 if the plan is inactive, outside its dates or below its minimum quantity.
      operationId: requestSubscription
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionRequest' }
      responses:
        '201':
          description: Draft subscription owned by the customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{id}/history:
    get:
      tags: [Subscriptions]
      summary: Status history of a subscription
      description: Admin, staff, and the owning customer. Every status change plus pause, resume and renew events, newest first, so anyone can see where a subscription stands and how it got there.
      operationId: getSubscriptionHistory
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of history entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChangeList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # --------------------------------------------------------------- BILLING
  /billing/runs:
    get:
      tags: [Billing]
      summary: List past billing runs
      description: Admin, staff. Real runs only (dry runs are not stored), newest first.
      operationId: listBillingRuns
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingRunList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /billing/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Billing]
      summary: Get one billing run
      description: Admin, staff. Counts plus the invoices created and the subscriptions that failed, so a failed run can be retried.
      operationId: getBillingRun
      x-roles: [admin, staff]
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingRunDetail' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /billing/due:
    get:
      tags: [Billing]
      summary: Preview subscriptions due for billing
      description: Admin, staff. Lists active, non-paused subscriptions whose `nextBillingDate` is on or before `asOf`, is not after `expiryDate`, and that have no non-cancelled invoice yet for that period.
      operationId: listDueSubscriptions
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: asOf
          in: query
          description: Defaults to today
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page of due subscriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DueSubscriptionList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /billing/run:
    post:
      tags: [Billing]
      summary: Generate invoices for everything due
      description: |
        Admin, staff. Creates one `draft` invoice per due subscription, filled with customer, lines, discounts, taxes and totals,
        then advances `nextBillingDate`. Safe to run repeatedly: a unique rule on (subscription, billing period) means nothing is billed twice,
        and anything that failed is reported under `failed` so it can be retried and nothing is skipped silently.
        If several periods were missed the run creates one invoice per period until caught up, but never for a period that starts after `expiryDate`.
        Real runs (not `dryRun`) are stored and can be read back under `/billing/runs`.
        Use `dryRun=true` to see what would be created without saving.
      operationId: runBilling
      x-roles: [admin, staff]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingRunRequest' }
      responses:
        '200':
          description: Result of the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingRunResult' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /billing/auto-close:
    post:
      tags: [Billing]
      summary: Close expired subscriptions (daily job)
      description: |
        Admin only. The daily job behind the `autoClose` plan flag: moves every `active` subscription whose plan has `autoClose=true`
        and whose `expiryDate` is before `asOf` (default today) to `closed`, clears `nextBillingDate`, and writes a status-history entry
        with `changedBy: null` (an automatic change). Safe to call repeatedly. Schedule it once a day, after the billing run.
      operationId: autoCloseSubscriptions
      x-roles: [admin]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoCloseRequest' }
      responses:
        '200':
          description: Subscriptions closed by this call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoCloseResult' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- INVOICES
  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      description: Admin, staff see all. Customers see only their own. Use `isOverdue=true` for the overdue list.
      operationId: listInvoices
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: subscriptionId
          in: query
          schema: { type: string, format: uuid }
        - name: isOverdue
          in: query
          description: Confirmed invoices past their due date with an amount still due
          schema: { type: boolean }
        - name: hasBalance
          in: query
          description: true for outstanding invoices, false for fully paid ones
          schema: { type: boolean }
        - name: issuedFrom
          in: query
          schema: { type: string, format: date }
        - name: issuedTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page of invoices (without lines)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Invoices]
      summary: Get an invoice with lines and payments
      description: Admin, staff, and the owning customer.
      operationId: getInvoice
      x-roles: [admin, staff, customer]
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Invoices]
      summary: Correct a draft invoice
      description: Admin, staff. Draft only (409 otherwise). Fixes a wrong line before it goes out; the server recomputes discount, tax and totals. To change anything on a confirmed invoice, cancel it and let billing recreate it.
      operationId: updateInvoice
      x-roles: [admin, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceUpdate' }
      responses:
        '200':
          description: Updated draft invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /invoices/{id}/confirm:
    post:
      tags: [Invoices]
      summary: Draft to Confirmed
      description: Admin, staff. Locks the invoice, sets the issue date and due date (issue date plus the subscription's payment terms). 409 if not a draft.
      operationId: confirmInvoice
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Confirmed invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /invoices/{id}/cancel:
    post:
      tags: [Invoices]
      summary: Cancel an invoice
      description: Admin, staff. Allowed for `draft` and `confirmed` invoices with no payments (422 if a payment exists). Releases the billing period for that subscription and any discount usage. If it is the subscription's latest invoice, `nextBillingDate` is rewound to the invoice's `periodStart` so the period is billed again by the next run.
      operationId: cancelInvoice
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cancelled invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /invoices/{id}/send:
    post:
      tags: [Invoices]
      summary: Email the invoice to the customer
      description: Admin, staff. Only `confirmed` or `paid` invoices (409 otherwise). Sets `sentAt`. Optional override recipient.
      operationId: sendInvoice
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendInvoiceRequest' }
      responses:
        '200':
          description: Invoice with updated `sentAt`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /invoices/{id}/print:
    get:
      tags: [Invoices]
      summary: Printable invoice (PDF)
      description: Admin, staff, and the owning customer. Returns a PDF for printing or download.
      operationId: printInvoice
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ----------------------------------------------------------------- TAXES
  /taxes:
    get:
      tags: [Taxes]
      summary: List tax rules
      description: Admin, staff.
      operationId: listTaxes
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of taxes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Taxes]
      summary: Create a tax rule
      description: Admin only. Taxes apply automatically to lines whose product type matches `appliesToProductTypes` (empty means every type).
      operationId: createTax
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxInput' }
      responses:
        '201':
          description: Created tax
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tax' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /taxes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Taxes]
      summary: Get a tax rule
      description: Admin, staff.
      operationId: getTax
      x-roles: [admin, staff]
      responses:
        '200':
          description: The tax
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tax' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Taxes]
      summary: Update a tax rule
      description: Admin only. Affects future invoices only.
      operationId: updateTax
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxUpdate' }
      responses:
        '200':
          description: Updated tax
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tax' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Taxes]
      summary: Deactivate a tax rule
      description: Admin only. Soft delete (`isActive=false`). 204 on success.
      operationId: deactivateTax
      x-roles: [admin]
      responses:
        '204': { description: Deactivated }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------- DISCOUNTS
  /discounts:
    get:
      tags: [Discounts]
      summary: List discount rules
      description: Admin, staff.
      operationId: listDiscounts
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Q'
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: validOn
          in: query
          description: Only discounts that are within their dates and not used up on this date
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page of discounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscountList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Discounts]
      summary: Create a discount rule
      description: |
        Admin only. Fixed amount or percentage, with optional minimum purchase and minimum quantity, start and end dates and a usage limit.
        Applies either to specific products (`scope=products`) or to subscriptions (`scope=subscriptions`, empty `subscriptionIds` means all).
        Once active it is applied automatically on the next invoice and stops when it expires or `usedCount` reaches `usageLimit`.
      operationId: createDiscount
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountInput' }
      responses:
        '201':
          description: Created discount
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discount' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /discounts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Discounts]
      summary: Get a discount rule
      description: Admin, staff.
      operationId: getDiscount
      x-roles: [admin, staff]
      responses:
        '200':
          description: The discount
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discount' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Discounts]
      summary: Update a discount rule
      description: Admin only. `usedCount` cannot be edited. Lowering `usageLimit` below `usedCount` returns 422.
      operationId: updateDiscount
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountUpdate' }
      responses:
        '200':
          description: Updated discount
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discount' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Discounts]
      summary: Deactivate a discount rule
      description: Admin only. Soft delete (`isActive=false`) so used discounts stay on historic invoices. 204 on success.
      operationId: deactivateDiscount
      x-roles: [admin]
      responses:
        '204': { description: Deactivated }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # -------------------------------------------------------------- PAYMENTS
  /payments:
    get:
      tags: [Payments]
      summary: List payments
      description: Admin, staff see all. Customers see only payments on their own invoices.
      operationId: listPayments
      x-roles: [admin, staff, customer]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: invoiceId
          in: query
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: method
          in: query
          schema: { $ref: '#/components/schemas/PaymentMethod' }
        - name: paidFrom
          in: query
          schema: { type: string, format: date }
        - name: paidTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Page of payments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentList' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Payments]
      summary: Record a payment against an invoice
      description: |
        Admin, staff. The invoice must be `confirmed` (422 otherwise) and `amount` cannot exceed the amount still due (422).
        When the amount due reaches zero the invoice moves to `paid` automatically.
      operationId: recordPayment
      x-roles: [admin, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Recorded payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /payments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Payments]
      summary: Get a payment
      description: Admin, staff, and the owning customer.
      operationId: getPayment
      x-roles: [admin, staff, customer]
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Payments]
      summary: Void a payment
      description: Admin only. Marks the payment as voided, recalculates the invoice balance and moves a `paid` invoice back to `confirmed`. 204 on success.
      operationId: voidPayment
      x-roles: [admin]
      responses:
        '204': { description: Voided }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # --------------------------------------------------------------- REPORTS
  /reports/summary:
    get:
      tags: [Reports]
      summary: Finance dashboard summary
      description: |
        Admin, staff. One call for the dashboard cards: active subscriptions, revenue collected, amount still owed,
        overdue invoices, MRR, plus breakdowns. Must respond in under 2 seconds on thousands of subscriptions.
      operationId: getSummary
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: planId
          in: query
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /reports/revenue:
    get:
      tags: [Reports]
      summary: Revenue over time
      description: Admin, staff. Invoiced versus collected amounts grouped by period, for the dashboard chart.
      operationId: getRevenueSeries
      x-roles: [admin, staff]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: groupBy
          in: query
          schema: { type: string, enum: [day, week, month], default: month }
        - name: planId
          in: query
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RevenuePoint' }
        '4XX': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Q:
      name: q
      in: query
      description: Free-text search
      schema: { type: string }
    From:
      name: from
      in: query
      description: Start date (inclusive). Defaults to the first day of the current month.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: End date (inclusive). Defaults to today.
      schema: { type: string, format: date }

  responses:
    Error:
      description: Error (400, 401, 403, 404, 409, 422 or 500)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------------------------------------------------------- shared
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, BUSINESS_RULE, INTERNAL]
            message: { type: string }
            details:
              type: array
              description: Field-level problems for VALIDATION_ERROR
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: Decimal string with exactly two decimals. Never a JSON float, so totals do not drift.
      example: '560.00'
    Address:
      type: object
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
    CustomerRef:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }

    # ------------------------------------------------------------ auth
    Role:
      type: string
      enum: [admin, staff, customer]
    Password:
      type: string
      format: password
      minLength: 9
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{9,}$'
      description: More than 8 characters with an uppercase letter, a lowercase letter and a special character.
      example: Brightloop#2026
    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { $ref: '#/components/schemas/Password' }
        company: { type: string }
        phone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      required: [token, expiresIn, user]
      properties:
        token: { type: string, description: JWT }
        expiresIn: { type: integer, description: Seconds until the token expires }
        user: { $ref: '#/components/schemas/User' }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { $ref: '#/components/schemas/Password' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { $ref: '#/components/schemas/Password' }
    User:
      type: object
      required: [id, name, email, role, isActive, customerId, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        customerId:
          type: string
          format: uuid
          nullable: true
          description: Set only for customers
        createdAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        company: { type: string }
        address: { $ref: '#/components/schemas/Address' }
    StaffCreate:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { $ref: '#/components/schemas/Password' }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        isActive: { type: boolean }
    UserList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # -------------------------------------------------------- customers
    CustomerInput:
      allOf:
        - $ref: '#/components/schemas/CustomerFields'
        - type: object
          required: [name, email]
    CustomerUpdate:
      description: Partial update. Send only the fields to change.
      allOf:
        - $ref: '#/components/schemas/CustomerFields'
    CustomerFields:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        company: { type: string }
        taxId: { type: string }
        address: { $ref: '#/components/schemas/Address' }
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          required: [id, hasLogin, activeSubscriptions, createdAt]
          properties:
            id: { type: string, format: uuid }
            hasLogin: { type: boolean }
            activeSubscriptions: { type: integer }
            createdAt: { type: string, format: date-time }
    CustomerList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # --------------------------------------------------------- products
    ProductType:
      type: string
      enum: [software, addon, service, goods]
    ProductInput:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - type: object
          required: [name, type, salesPrice, costPrice]
    ProductUpdate:
      description: Partial update. Send only the fields to change.
      allOf:
        - $ref: '#/components/schemas/ProductFields'
    ProductFields:
      type: object
      properties:
        name: { type: string, example: Brightloop CRM }
        type: { $ref: '#/components/schemas/ProductType' }
        salesPrice: { $ref: '#/components/schemas/Money' }
        costPrice: { $ref: '#/components/schemas/Money' }
        notes: { type: string }
        isActive: { type: boolean, default: true }
        variants:
          type: array
          description: Optional on create
          items: { $ref: '#/components/schemas/VariantInput' }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, variants, createdAt]
          properties:
            id: { type: string, format: uuid }
            variants:
              type: array
              items: { $ref: '#/components/schemas/Variant' }
            createdAt: { type: string, format: date-time }
    VariantInput:
      allOf:
        - $ref: '#/components/schemas/VariantFields'
        - type: object
          required: [attribute, value, extraPrice]
    VariantUpdate:
      description: Partial update. Send only the fields to change.
      allOf:
        - $ref: '#/components/schemas/VariantFields'
    VariantFields:
      type: object
      properties:
        attribute: { type: string, example: Brand }
        value: { type: string, example: Odoo }
        extraPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Added to the product sales price when this variant is chosen
          example: '560.00'
    Variant:
      allOf:
        - $ref: '#/components/schemas/VariantInput'
        - type: object
          required: [id, productId, isArchived]
          properties:
            id: { type: string, format: uuid }
            productId: { type: string, format: uuid }
            isArchived:
              type: boolean
              description: Archived variants stay on existing lines and invoices but cannot be chosen on new ones
    ProductList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ------------------------------------------------------------ plans
    BillingPeriod:
      type: string
      enum: [daily, weekly, monthly, yearly]
    PlanInput:
      allOf:
        - $ref: '#/components/schemas/PlanFields'
        - type: object
          required: [name, price, billingPeriod, minQuantity, availableFrom]
    PlanUpdate:
      description: Partial update. Send only the fields to change.
      allOf:
        - $ref: '#/components/schemas/PlanFields'
    PlanFields:
      type: object
      properties:
        name: { type: string, example: Business Monthly }
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: List price shown to customers and staff. It is not added to invoices; every invoice total comes only from the subscription lines.
        billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
        minQuantity: { type: integer, minimum: 1, default: 1 }
        availableFrom: { type: string, format: date }
        availableTo:
          type: string
          format: date
          nullable: true
          description: Null means no end date
        autoClose:
          type: boolean
          description: Subscriptions close by themselves after their expiry date
          default: false
        allowEarlyClose: { type: boolean, default: false }
        allowPause: { type: boolean, default: false }
        allowRenew: { type: boolean, default: true }
        isActive: { type: boolean, default: true }
    Plan:
      allOf:
        - $ref: '#/components/schemas/PlanInput'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    PlanList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Plan' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ------------------------------------------------ quotation templates
    TemplateLine:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid, nullable: true }
        quantity: { type: integer, minimum: 1 }
    QuotationTemplateInput:
      allOf:
        - $ref: '#/components/schemas/QuotationTemplateFields'
        - type: object
          required: [name, planId, validityDays, lines]
    QuotationTemplateUpdate:
      description: Partial update. Send only the fields to change.
      allOf:
        - $ref: '#/components/schemas/QuotationTemplateFields'
    QuotationTemplateFields:
      type: object
      properties:
        name: { type: string, example: Enterprise yearly starter }
        planId: { type: string, format: uuid }
        validityDays:
          type: integer
          minimum: 1
          description: How many days a quotation made from this template stays valid
          example: 30
        lines:
          type: array
          items: { $ref: '#/components/schemas/TemplateLine' }
        notes: { type: string }
    QuotationTemplate:
      allOf:
        - $ref: '#/components/schemas/QuotationTemplateInput'
        - type: object
          required: [id, planName, createdAt]
          properties:
            id: { type: string, format: uuid }
            planName: { type: string }
            createdAt: { type: string, format: date-time }
    QuotationTemplateList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/QuotationTemplate' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ---------------------------------------------------- subscriptions
    SubscriptionStatus:
      type: string
      enum: [draft, quotation, confirmed, active, closed]
    PaymentTerms:
      type: string
      enum: [immediate, net_15, net_30, net_45, net_60]
      description: Invoice due date is issue date plus the term
    LineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid, nullable: true }
        quantity: { type: integer, minimum: 1 }
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Optional override; defaults to product sales price plus variant extra price
    SubscriptionLine:
      type: object
      required: [id, productId, productName, variantId, quantity, unitPrice, taxId, taxAmount, amount]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantId: { type: string, format: uuid, nullable: true }
        variantLabel: { type: string, nullable: true, example: Brand Odoo }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money' }
        taxId: { type: string, format: uuid, nullable: true }
        taxName: { type: string, nullable: true }
        taxRate: { type: number, nullable: true }
        taxAmount: { $ref: '#/components/schemas/Money' }
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: quantity times unitPrice, before tax
    SubscriptionInput:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string, format: uuid }
        templateId:
          type: string
          format: uuid
          nullable: true
          description: Start from a quotation template
        planId: { type: string, format: uuid, description: Required unless taken from the template }
        startDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        paymentTerms: { $ref: '#/components/schemas/PaymentTerms' }
        lines:
          type: array
          description: Required unless taken from the template
          items: { $ref: '#/components/schemas/LineInput' }
        notes: { type: string }
    SubscriptionUpdate:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        paymentTerms: { $ref: '#/components/schemas/PaymentTerms' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/LineInput' }
        notes: { type: string }
    Subscription:
      type: object
      required: [id, number, status, isPaused, customer, plan, startDate, expiryDate, paymentTerms, nextBillingDate, lines, subtotal, taxTotal, total, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: SUB-0001 }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        isPaused: { type: boolean }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        plan:
          type: object
          nullable: true
          description: Null while a draft has no plan yet
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            billingPeriod: { $ref: '#/components/schemas/BillingPeriod' }
            allowEarlyClose: { type: boolean }
            allowPause: { type: boolean }
            allowRenew: { type: boolean }
        templateId: { type: string, format: uuid, nullable: true }
        startDate: { type: string, format: date, nullable: true, description: Null only while a draft }
        expiryDate: { type: string, format: date, nullable: true, description: Null only while a draft }
        paymentTerms:
          type: string
          allOf:
            - $ref: '#/components/schemas/PaymentTerms'
          nullable: true
          description: Null only while a draft
        quotationValidUntil: { type: string, format: date, nullable: true }
        nextBillingDate: { type: string, format: date, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionLine' }
        subtotal: { $ref: '#/components/schemas/Money' }
        taxTotal: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        notes: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        closeReason: { type: string, nullable: true }
    SubscriptionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Subscription' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    CloseRequest:
      type: object
      properties:
        reason: { type: string }
    RenewRequest:
      type: object
      properties:
        newExpiryDate:
          type: string
          format: date
          description: Defaults to the current expiry plus one plan term

    # ---------------------------------------------------------- billing
    BillingRunRequest:
      type: object
      properties:
        asOf:
          type: string
          format: date
          description: Defaults to today
        subscriptionIds:
          type: array
          description: Limit the run to these subscriptions; omit for all due
          items: { type: string, format: uuid }
        dryRun: { type: boolean, default: false }
    DueSubscription:
      type: object
      required: [subscriptionId, number, customer, nextBillingDate, estimatedTotal]
      properties:
        subscriptionId: { type: string, format: uuid }
        number: { type: string }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        nextBillingDate: { type: string, format: date }
        estimatedTotal: { $ref: '#/components/schemas/Money' }
    DueSubscriptionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DueSubscription' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    BillingRunResult:
      type: object
      required: [runId, asOf, dryRun, counts, created, failed]
      properties:
        runId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        dryRun: { type: boolean }
        counts:
          type: object
          properties:
            due: { type: integer }
            created: { type: integer }
            alreadyBilled: { type: integer }
            failed: { type: integer }
        created:
          type: array
          items: { $ref: '#/components/schemas/InvoiceSummary' }
        failed:
          type: array
          items:
            type: object
            properties:
              subscriptionId: { type: string, format: uuid }
              number: { type: string }
              reason: { type: string }

    AutoCloseRequest:
      type: object
      properties:
        asOf:
          type: string
          format: date
          description: Defaults to today. Subscriptions with `expiryDate` before this date are closed.
    AutoCloseResult:
      type: object
      required: [asOf, closedCount, closed]
      properties:
        asOf: { type: string, format: date }
        closedCount: { type: integer }
        closed:
          type: array
          items:
            type: object
            required: [subscriptionId, number]
            properties:
              subscriptionId: { type: string, format: uuid }
              number: { type: string }

    # --------------------------------------------------------- invoices
    InvoiceStatus:
      type: string
      enum: [draft, confirmed, paid, cancelled]
    InvoiceLine:
      type: object
      required: [id, productId, description, quantity, unitPrice, discountAmount, taxAmount, amount]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discountId: { type: string, format: uuid, nullable: true }
        discountAmount: { $ref: '#/components/schemas/Money' }
        taxId: { type: string, format: uuid, nullable: true }
        taxName: { type: string, nullable: true }
        taxRate: { type: number, nullable: true }
        taxAmount: { $ref: '#/components/schemas/Money' }
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: quantity times unitPrice minus discountAmount, before tax
    InvoiceSummary:
      type: object
      required: [id, number, status, subscriptionId, subscriptionNumber, customer, periodStart, periodEnd, issueDate, dueDate, subtotal, discountTotal, taxTotal, total, amountPaid, amountDue, isOverdue, sentAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: INV-2026-0001 }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        subscriptionId: { type: string, format: uuid }
        subscriptionNumber: { type: string }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        issueDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        taxTotal: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        amountPaid: { $ref: '#/components/schemas/Money' }
        amountDue: { $ref: '#/components/schemas/Money' }
        isOverdue: { type: boolean }
        sentAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceSummary'
        - type: object
          required: [lines, payments, customerDetails]
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/InvoiceLine' }
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            customerDetails:
              allOf:
                - $ref: '#/components/schemas/CustomerFields'
              description: Billing name and address copied from the customer when the invoice is created. Later edits to the customer do not change it.
            notes: { type: string }
    InvoiceList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InvoiceSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    SendInvoiceRequest:
      type: object
      properties:
        to:
          type: string
          format: email
          description: Defaults to the customer email
        message: { type: string }

    SubscriptionRequest:
      type: object
      required: [planId, startDate, lines]
      properties:
        planId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TemplateLine' }
        notes: { type: string }
    StatusChange:
      type: object
      required: [id, event, fromStatus, toStatus, changedBy, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        event:
          type: string
          enum: [created, status_change, paused, resumed, renewed]
        fromStatus:
          type: string
          allOf:
            - $ref: '#/components/schemas/SubscriptionStatus'
          nullable: true
        toStatus: { $ref: '#/components/schemas/SubscriptionStatus' }
        changedBy:
          type: object
          nullable: true
          description: Null for automatic changes such as auto-close
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    StatusChangeList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StatusChange' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    BillingRunSummary:
      type: object
      required: [runId, asOf, startedBy, startedAt, counts]
      properties:
        runId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        startedBy: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        counts:
          type: object
          properties:
            due: { type: integer }
            created: { type: integer }
            alreadyBilled: { type: integer }
            failed: { type: integer }
    BillingRunList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BillingRunSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    BillingRunDetail:
      allOf:
        - $ref: '#/components/schemas/BillingRunSummary'
        - type: object
          required: [created, failed]
          properties:
            created:
              type: array
              items: { $ref: '#/components/schemas/InvoiceSummary' }
            failed:
              type: array
              items:
                type: object
                properties:
                  subscriptionId: { type: string, format: uuid }
                  number: { type: string }
                  reason: { type: string }
    InvoiceLineUpdate:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
    InvoiceUpdate:
      type: object
      properties:
        notes: { type: string }
        lines:
          type: array
          description: Only the listed lines change
          items: { $ref: '#/components/schemas/InvoiceLineUpdate' }

    # ------------------------------------------------------------ taxes
    TaxInput:
      allOf:
        - $ref: '#/components/schemas/TaxFields'
        - type: object
          required: [name, computation, value]
    TaxUpdate:
      description: Partial update. Send only the fields to change.
      allOf:
        - $ref: '#/components/schemas/TaxFields'
    TaxFields:
      type: object
      properties:
        name: { type: string, example: GST 18% }
        computation:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
          minimum: 0
          description: Percent (for example 18) or a fixed amount per line
        appliesToProductTypes:
          type: array
          description: Empty means every product type
          items: { $ref: '#/components/schemas/ProductType' }
        isActive: { type: boolean, default: true }
    Tax:
      allOf:
        - $ref: '#/components/schemas/TaxInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    TaxList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Tax' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # -------------------------------------------------------- discounts
    DiscountInput:
      allOf:
        - $ref: '#/components/schemas/DiscountFields'
        - type: object
          required: [name, type, value, scope, startDate]
    DiscountUpdate:
      description: Partial update. Send only the fields to change.
      allOf:
        - $ref: '#/components/schemas/DiscountFields'
    DiscountFields:
      type: object
      properties:
        name: { type: string, example: 50+ seats volume discount }
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
          minimum: 0
          description: Percent (0-100, 422 above 100) or a fixed amount. For a fixed `subscriptions` scope discount the amount is shared across the invoice lines in proportion to each line's amount, and the rounding remainder goes on the last line.
        minPurchaseAmount: { $ref: '#/components/schemas/Money' }
        minQuantity: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        usageLimit:
          type: integer
          nullable: true
          description: Maximum number of invoices it can apply to; null means unlimited
        scope:
          type: string
          enum: [products, subscriptions]
        productIds:
          type: array
          description: Used when scope is products
          items: { type: string, format: uuid }
        subscriptionIds:
          type: array
          description: Used when scope is subscriptions; empty means all subscriptions
          items: { type: string, format: uuid }
        isActive: { type: boolean, default: true }
    Discount:
      allOf:
        - $ref: '#/components/schemas/DiscountInput'
        - type: object
          required: [id, usedCount, status]
          properties:
            id: { type: string, format: uuid }
            usedCount: { type: integer }
            status:
              type: string
              enum: [scheduled, running, expired, exhausted, inactive]
              description: Computed from dates, usage and isActive
    DiscountList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Discount' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # --------------------------------------------------------- payments
    PaymentMethod:
      type: string
      enum: [cash, bank_transfer, card, upi, cheque, other]
    PaymentInput:
      type: object
      required: [invoiceId, method, amount, paymentDate]
      properties:
        invoiceId: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        paymentDate: { type: string, format: date }
        reference:
          type: string
          description: Bank reference, cheque number, transaction id
        note: { type: string }
    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentInput'
        - type: object
          required: [id, invoiceNumber, customer, isVoided, recordedBy, createdAt]
          properties:
            id: { type: string, format: uuid }
            invoiceNumber: { type: string }
            customer: { $ref: '#/components/schemas/CustomerRef' }
            isVoided: { type: boolean }
            recordedBy: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    PaymentList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ---------------------------------------------------------- reports
    DashboardSummary:
      type: object
      required: [period, subscriptions, mrr, revenueInvoiced, revenueCollected, outstanding, overdue, invoicesByStatus, paymentsByMethod]
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        subscriptions:
          type: object
          properties:
            active: { type: integer }
            byStatus:
              type: object
              additionalProperties: { type: integer }
              example: { draft: 4, quotation: 7, confirmed: 3, active: 120, closed: 15 }
        mrr:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Monthly recurring revenue of active, non-paused subscriptions (yearly plans divided by 12, weekly and daily scaled to a month)
        revenueInvoiced: { $ref: '#/components/schemas/Money' }
        revenueCollected:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Sum of non-voided payments in the period
        outstanding:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Amount due on confirmed invoices, as of today
        overdue:
          type: object
          properties:
            count: { type: integer }
            amount: { $ref: '#/components/schemas/Money' }
        invoicesByStatus:
          type: object
          additionalProperties: { type: integer }
        paymentsByMethod:
          type: array
          items:
            type: object
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              count: { type: integer }
              amount: { $ref: '#/components/schemas/Money' }
    RevenuePoint:
      type: object
      required: [period, invoiced, collected]
      properties:
        period:
          type: string
          description: Start date of the day, week or month
          example: '2026-10-01'
        invoiced: { $ref: '#/components/schemas/Money' }
        collected: { $ref: '#/components/schemas/Money' }
